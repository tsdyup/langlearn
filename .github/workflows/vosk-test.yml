name: vosk-test
on:
  push:
    branches: [experiments]
jobs:
  strict:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'microsoft' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg jq > /dev/null
      - name: deps, model, item names, audio
        run: |
          M=https://repo1.maven.org/maven2
          mkdir lib && cd lib
          for p in com/alphacephei/vosk/0.3.45/vosk-0.3.45 net/java/dev/jna/jna/5.17.0/jna-5.17.0 com/google/code/gson/gson/2.11.0/gson-2.11.0 org/slf4j/slf4j-api/2.0.16/slf4j-api-2.0.16 com/atilika/kuromoji/kuromoji-core/0.9.0/kuromoji-core-0.9.0 com/atilika/kuromoji/kuromoji-ipadic/0.9.0/kuromoji-ipadic-0.9.0 com/ibm/icu/icu4j/76.1/icu4j-76.1; do curl -sSLO $M/$p.jar; done
          cd ..
          curl -sSL -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip && unzip -q m.zip
          V=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[]|select(.id=="26.3")|.url')
          curl -s "$(curl -s "$V" | jq -r '.assetIndex.url')" > index.json
          H=$(jq -r '.objects["minecraft/lang/ru_ru.json"].hash' index.json)
          curl -s "https://resources.download.minecraft.net/${H:0:2}/$H" | jq '[to_entries[]|select(.key|test("^(item|block)\\.minecraft\\.[a-z0-9_]+$"))|.value|select(test("%")|not)]' > names.json
          mkdir wav
          say() { espeak-ng -v ru -s 140 "$2" -w t.wav; ffmpeg -loglevel error -y -i t.wav -ar 16000 -ac 1 -c:a pcm_s16le "wav/${1// /_}__${2// /_}.wav"; }
          say палка палка; say палка полка; say палка пачка; say палка балка
          say книга книга; say книга книги; say книга нига
          say "алмазный меч" "алмазный меч"; say "алмазный меч" "алмазный мяч"; say "алмазный меч" "алмазный мех"
          say яблоко яблоко; say яблоко яблока
      - name: run
        run: |
          CP=$(ls lib/*.jar | tr '\n' ':')
          mkdir out && javac -encoding UTF-8 -cp "$CP" -d out tools/stricttest/dev/langlearn/client/Translations.java tools/stricttest/dev/langlearn/client/speech/*.java src/client/java/dev/langlearn/client/speech/{Vosk,FstSymbols,Confusables,Grammar,VoskModels}.java src/client/java/dev/langlearn/client/text/*.java
          java -Dnames=names.json -cp "out:$CP" dev.langlearn.client.speech.StrictTest vosk-model-small-ru-0.22 wav 2>&1 | grep -v "^LOG\|WARNING"
