name: vosk-test
on:
  push:
    branches: [experiments]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'microsoft' }
      - name: Java FstSymbols on the Russian and Chinese models
        run: |
          curl -sSL -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip && unzip -q m.zip && rm m.zip
          curl -sSL -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip && unzip -q m.zip && rm m.zip
          mkdir out && javac -d out src/client/java/dev/langlearn/client/speech/FstSymbols.java tools/javatest/dev/langlearn/client/speech/FstTest.java
          java -cp out dev.langlearn.client.speech.FstTest vosk-model-small-ru-0.22/graph/Gr.fst палка книга алмазный
          java -cp out dev.langlearn.client.speech.FstTest vosk-model-small-cn-0.22/graph/Gr.fst 钻石 剑 苹果
      - name: Japanese words.txt format
        run: |
          curl -sSL -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-ja-0.22.zip && unzip -q m.zip && rm m.zip
          W=vosk-model-small-ja-0.22/graph/words.txt
          wc -l $W
          grep -E "^(ダイヤモンド|剣|パン|の|リンゴ|鉄|インゴット|チェスト|棒|本)[ +]" $W | head -20
          grep -m5 "ダイヤ" $W; grep -m5 "^本" $W; shuf -n 15 --random-source=$W $W
