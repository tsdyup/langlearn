name: vosk-test
on:
  push:
    branches: [experiments]
jobs:
  tts-windows:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'microsoft' }
      - run: |
          curl -sSL -o slf4j.jar https://repo1.maven.org/maven2/org/slf4j/slf4j-api/2.0.16/slf4j-api-2.0.16.jar
          mkdir out && javac -encoding UTF-8 -cp slf4j.jar -d out src/client/java/dev/langlearn/client/speech/Tts.java tools/ttstest/dev/langlearn/client/speech/TtsTest.java
          java -cp "out;slf4j.jar" dev.langlearn.client.speech.TtsTest
      - name: check the Russian audio with the speech recognizer
        run: |
          pip install -q vosk
          curl -sSL -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip && unzip -q m.zip
          python - <<'P'
          import glob, json, wave, subprocess
          from vosk import Model, KaldiRecognizer, SetLogLevel
          SetLogLevel(-1)
          m = Model("vosk-model-small-ru-0.22")
          for f in glob.glob("ttsbase/tts/cache/ru_RU-*/*.wav"):
              wf = wave.open(f,"rb"); r = KaldiRecognizer(m, wf.getframerate())
              while True:
                  d = wf.readframes(4000)
                  if not d: break
                  r.AcceptWaveform(d)
              print(f, "->", json.loads(r.FinalResult())["text"].encode("unicode_escape").decode())
          P
          curl -sSL -o c.zip https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip && unzip -q c.zip
          python - <<'P'
          import glob, json, wave, subprocess
          from vosk import Model, KaldiRecognizer, SetLogLevel
          SetLogLevel(-1)
          m = Model("vosk-model-small-cn-0.22")
          for f in glob.glob("ttsbase/tts/cache/zh_CN-*/*.wav"):
              wf = wave.open(f,"rb"); r = KaldiRecognizer(m, wf.getframerate())
              while True:
                  d = wf.readframes(4000)
                  if not d: break
                  r.AcceptWaveform(d)
              print(f, "->", json.loads(r.FinalResult())["text"].encode("unicode_escape").decode())
          P
      - name: phoneme types of mapped voices
        if: always()
        run: |
          for v in $(grep -o '"[a-z][a-z]/[a-z][a-z]_[A-Z][A-Z]/[^"]*"' src/client/java/dev/langlearn/client/speech/Tts.java | tr -d '"' | sort -u); do
            echo "$v $(curl -sSL https://huggingface.co/rhasspy/piper-voices/resolve/main/$v.onnx.json | grep -o '"phoneme_type": *"[a-z_]*"')"
          done
