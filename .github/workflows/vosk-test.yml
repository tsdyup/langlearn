name: vosk-test
on:
  push:
    branches: [experiments]
jobs:
  tts-windows:
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with: { java-version: '25', distribution: 'microsoft' }
      - run: |
          curl -sSL -o slf4j.jar https://repo1.maven.org/maven2/org/slf4j/slf4j-api/2.0.16/slf4j-api-2.0.16.jar
          mkdir out && javac -encoding UTF-8 -cp slf4j.jar -d out src/client/java/dev/langlearn/client/speech/Tts.java tools/ttstest/dev/langlearn/client/speech/TtsTest.java
          java -cp "out;slf4j.jar" dev.langlearn.client.speech.TtsTest
      - name: check the Russian audio with the speech recognizer
        run: |
          pip install -q vosk
          curl -sSL -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip && unzip -q m.zip
          python - <<'P'
          import glob, json, wave, subprocess
          from vosk import Model, KaldiRecognizer, SetLogLevel
          SetLogLevel(-1)
          m = Model("vosk-model-small-ru-0.22")
          for f in glob.glob("ttsbase/cache/ru_RU-*/*.wav"):
              subprocess.run(["ffmpeg","-loglevel","error","-y","-i",f,"-ar","16000","-ac","1","t.wav"])
              wf = wave.open("t.wav","rb"); r = KaldiRecognizer(m, 16000)
              while True:
                  d = wf.readframes(4000)
                  if not d: break
                  r.AcceptWaveform(d)
              print(f, "->", json.loads(r.FinalResult())["text"].encode("unicode_escape").decode())
          P
