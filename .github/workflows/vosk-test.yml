name: vosk-test
on:
  push:
    branches: [experiments]
jobs:
  piper-info:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for u in https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip; do echo "$u -> $(curl -sIL -o /dev/null -w '%{http_code} %{size_download}' $u) $(curl -sIL $u | grep -i content-length | tail -1)"; done
          curl -sSL https://huggingface.co/rhasspy/piper-voices/resolve/main/voices.json > voices.json
          jq -r 'to_entries[] | "\(.value.language.code) \(.value.quality) \(.key) \(.value.files|keys|map(select(endswith(".onnx")))[0]) \(.value.files|to_entries|map(select(.key|endswith(".onnx")))[0].value.size_bytes)"' voices.json | sort > list.txt
          wc -l list.txt
          # best per locale: medium > high > low > x_low
          awk '{q=$2; r=(q=="medium"?0:(q=="high"?1:(q=="low"?2:3))); if(!($1 in best) || r<br[$1]){best[$1]=$0; br[$1]=r}} END{for(k in best) print best[k]}' list.txt | sort
