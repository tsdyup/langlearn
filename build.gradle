plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "langlearn"
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"langlearn" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Offline speech recognition. Minecraft already ships JNA, so only Vosk itself is bundled.
	implementation "com.alphacephei:vosk:${project.vosk_version}"
	include "com.alphacephei:vosk:${project.vosk_version}"

	// Japanese tokenizer: turns kanji into readings so we can show romaji.
	implementation "com.atilika.kuromoji:kuromoji-ipadic:${project.kuromoji_version}"
	include "com.atilika.kuromoji:kuromoji-ipadic:${project.kuromoji_version}"
	include "com.atilika.kuromoji:kuromoji-core:${project.kuromoji_version}"

	// Chinese pinyin and other scripts use ICU4J, which Minecraft already ships at runtime.
	compileOnly "com.ibm.icu:icu4j:76.1"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
